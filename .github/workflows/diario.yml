name: Rastreo diario de precios

on:
  schedule:
    # 4:17 de Chile (07:17 UTC). GitHub suele atrasar estas ejecuciones varias horas,
    # así que se programa temprano para que los datos estén listos en la mañana.
    - cron: "17 7 * * *"
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
  push:                      # también corre al cambiar productos, tiendas o el programa
    branches: [main]
    paths: ["config/**", "ofertas/**", "web/**", ".github/workflows/**", "disparos/ultimo.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la última versión del historial, no la del cambio que lanzó la revisión

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest -q tests

      - name: Revisar tiendas, generar alertas, respaldo y panel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Gmail: basta con GMAIL_USUARIO y GMAIL_CLAVE_APP (clave de aplicación de Google)
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          URL_PANEL: ${{ vars.URL_PANEL }}
        run: python -m ofertas rastrear

      - name: Guardar historial en el repositorio (respaldo diario)
        run: |
          git config user.name "buscador-ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Precios del $(TZ=America/Santiago date +%F)"
          git pull --rebase -q origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: rastrear
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
