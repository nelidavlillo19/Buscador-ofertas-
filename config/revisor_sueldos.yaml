# Configuración del revisor de planillas de sueldo (python -m revisor_sueldos).
# Todos los montos son mensuales brutos en pesos. Ajusta los valores a la realidad de la institución.

# Clasificación de cada fila en un grupo de trabajadores. Se prueban en orden contra el estamento
# (y, si no calza, contra el cargo); son expresiones regulares sobre texto sin tildes y en minúsculas.
# Ojo: "profesor" contiene "profes", por eso académicos va antes que profesionales.
grupos:
  academicos: ["acad", "docen", "profesor", "investigador", "instructor"]
  directivos: ["direct", "autoridad", "rector", "decan", "jefe superior", "vicerrect"]
  profesionales: ["profesional"]
  tecnicos: ["tecnic"]
  administrativos: ["administrativ"]   # si prefieres sumarlos a auxiliares, mueve este patrón a esa lista
  auxiliares: ["auxiliar", "servicio", "mayordom", "portero", "chofer"]

# Jerarquías académicas reconocidas en cargo/estamento y su rango (mayor = más alta)
jerarquias_academicas:
  ayudante: 1
  instructor: 2
  adjunto: 3
  asistente: 4
  asociado: 5
  titular: 6

# Factor de costo para el empleador sobre el bruto (aportes de cargo de la universidad:
# seguro de accidentes, SIS, seguro de cesantía, etc.). Valores referenciales: ajústalos.
costo_empleador:
  planta: 0.024
  contrata: 0.024
  codigo_trabajo: 0.054
  honorarios: 0.0
  defecto: 0.024

revision:
  desvios_atipico: 3.0        # desviaciones estándar para marcar una remuneración atípica

trayectorias:
  mes_corte: 12               # se compara diciembre de cada año (o el último mes disponible)
  paso_a_planta_cuenta_como_ascenso: false
  orden_grupos: [auxiliares, administrativos, tecnicos, profesionales, academicos, directivos]

proyeccion:
  periodo_base: null          # null = último período cargado; o "2026-06"
  horizonte_anios: 5
  reajuste_anual: 0.035       # reajuste general del sector público supuesto (nominal)
  crecimiento_dotacion: 0.0
  tipos_incluidos: [planta, contrata, codigo_trabajo]   # honorarios quedan fuera del nuevo sistema
  jornada_completa: 44
  garantia_no_disminucion: true
  gradualidad: [0.25, 0.50, 0.75, 1.0]   # fracción acumulada de la brecha cerrada en el año 1, 2, 3, 4...
  tasas_ascenso: historicas   # o un diccionario {academicos: 0.08, profesionales: 0.06, ...}
  tasa_ascenso_defecto: 0.05  # si no hay historia suficiente para un grupo
  premio_ascenso_defecto: 0.05

  evaluacion:
    distribucion: {destacado: 0.20, bueno: 0.60, suficiente: 0.15, insuficiente: 0.05}
    incentivo:    {destacado: 0.06, bueno: 0.03, suficiente: 0.0, insuficiente: 0.0}   # % de la remuneración anual
    multiplicador_ascenso: {destacado: 1.5, bueno: 1.0, suficiente: 0.5, insuficiente: 0.0}

  # Nuevo sistema de jerarquización: niveles de menor a mayor.
  # criterio: jerarquia | grado | percentil. Si falta el dato se usa el percentil del sueldo en el grupo.
  # piso: remuneración mínima del nivel a jornada completa; incremento: % sobre el sueldo actual.
  jerarquizacion:
    academicos:
      criterio: jerarquia
      niveles:
        - {nombre: "Instructor",         jerarquias: [ayudante, instructor, adjunto], piso: 1900000}
        - {nombre: "Profesor Asistente", jerarquias: [asistente], piso: 2600000}
        - {nombre: "Profesor Asociado",  jerarquias: [asociado],  piso: 3400000}
        - {nombre: "Profesor Titular",   jerarquias: [titular],   piso: 4300000}
    directivos:
      criterio: grado
      niveles:
        - {nombre: "Directivo III", grados: [7, 25], piso: 3000000}
        - {nombre: "Directivo II",  grados: [4, 6],  piso: 3800000}
        - {nombre: "Directivo I",   grados: [1, 3],  piso: 4800000}
    profesionales:
      criterio: grado
      niveles:
        - {nombre: "Profesional C", grados: [14, 25], piso: 1500000}
        - {nombre: "Profesional B", grados: [10, 13], piso: 1950000}
        - {nombre: "Profesional A", grados: [5, 9],   piso: 2500000}
    tecnicos:
      criterio: grado
      niveles:
        - {nombre: "Técnico C", grados: [19, 30], piso: 950000}
        - {nombre: "Técnico B", grados: [15, 18], piso: 1150000}
        - {nombre: "Técnico A", grados: [10, 14], piso: 1400000}
    administrativos:
      criterio: grado
      niveles:
        - {nombre: "Administrativo C", grados: [21, 30], piso: 850000}
        - {nombre: "Administrativo B", grados: [17, 20], piso: 1000000}
        - {nombre: "Administrativo A", grados: [12, 16], piso: 1200000}
    auxiliares:
      criterio: grado
      niveles:
        - {nombre: "Auxiliar C", grados: [24, 31], piso: 700000}
        - {nombre: "Auxiliar B", grados: [20, 23], piso: 820000}
        - {nombre: "Auxiliar A", grados: [15, 19], piso: 950000}
