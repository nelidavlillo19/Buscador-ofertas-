    # Protegida por Cloudflare ("Un momento..."): bloquea incluso con navegador real (403).
    activa: false
    categorias: [trekking, maleta_cabina, organizadores_equipaje, banano_documentos]

  # ---------- Fotografía / tecnología (película Instax Mini) ----------
  - id: reifschneider
