    categorias: [trekking, maleta_cabina, organizadores_equipaje, banano_documentos, pelicula_instax_mini, pelicula_polaroid, cargador_portatil, robot_cocina, cafeteras,
                 hot_wheels_mario_kart, super_mario_juguetes, nee_doh, mini_color_stack, nenuco, cocina_juguete,
                 peluches, rompecabezas, dinosaurios, marcos_fotos, juguetes_ninos]

  - id: decathlon
