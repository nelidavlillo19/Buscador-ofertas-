# Tiendas a revisar.
#
# plataforma:
#   sfcc / falabella / cencosud / magento / ikea -> lectores especiales (SuperZoo, Falabella y Sodimac,
#                                            Santa Isabel, Casa Ideas)
#   auto     -> detecta sola si la tienda es Shopify, VTEX o usa datos schema.org (recomendado)
#   shopify  -> tiendas Shopify (usa /products.json y /search/suggest.json)
#   vtex     -> tiendas VTEX (API pública de catálogo)
#   jsonld   -> cualquier web con datos de producto schema.org en la página de búsqueda
#
# catalogo_completo: true  -> descarga todo el catálogo (útil en marcas pequeñas)
#                    false -> sólo busca los términos de cada categoría de interés
# categorias: limita qué categorías de interés se buscan en esa tienda (vacío = todas)
# alerta_precio_maximo: avisa todo producto de esa tienda que cueste esto o menos (p. ej. 10000)
# activa: false para pausar una tienda sin borrarla

tiendas:
  # ---------- Marcas infantiles ----------
  - id: pichintun
    nombre: Pichintun
    url: https://www.pichintun.com
    plataforma: auto
    catalogo_completo: true
    categorias: [traje_bano_nina_t2, traje_bano_nino_t6, ropa_nina_t2, ropa_nino_t6, calzado_ergonomico,
                 juguetes_ninos]

  - id: colloky
    nombre: Colloky
    url: https://www.colloky.cl
    plataforma: auto
    catalogo_completo: false
    categorias: [traje_bano_nina_t2, traje_bano_nino_t6, ropa_nina_t2, ropa_nino_t6, calzado_ergonomico,
                 juguetes_ninos]

  - id: umababy
    nombre: Uma Baby
    url: https://www.umababy.cl
    plataforma: auto
    catalogo_completo: true
    categorias: [calzado_ergonomico]

  - id: casaideas
    nombre: Casa Ideas
    url: https://www.casaideas.cl
    plataforma: magento
    api: https://headless.casaideas.cl/graphql
    ruta_producto: /producto/{url_key}
    categorias: [cargador_portatil, peluches, rompecabezas, libros_actividades, dinosaurios, juguetes_ninos, organizacion_hogar,
                 cafeteras, robot_cocina, pelicula_instax_mini]

  - id: ikea
    nombre: IKEA
    url: https://www.ikea.com/cl/es
    plataforma: ikea
    # Además de las ofertas de 30%+, avisa todo lo que cueste $10.000 o menos (peluches destacados)
    alerta_precio_maximo: 10000
    categorias: [cargador_portatil, peluches, rompecabezas, dinosaurios, juguetes_ninos, organizacion_hogar]

  # ---------- Mascotas ----------
  - id: superzoo
    nombre: SuperZoo
    url: https://www.superzoo.cl
    plataforma: sfcc
    categorias: [alimento_mascotas, juguetes_mascotas]

  # ---------- Fotografía / tecnología (película Instax Mini) ----------
  - id: reifschneider
    nombre: Reifschneider
    url: https://www.reifschneider.cl
    plataforma: auto
    # La tienda online redirige a una página cerrada con clave (aufbau.cl/password).
    activa: false
    categorias: [pelicula_instax_mini]

  - id: pcfactory
    nombre: PC Factory
    url: https://www.pcfactory.cl
    plataforma: auto
    # La página se arma sólo con JavaScript (api.pcfactory.cl); falta un lector especial.
    activa: false
    categorias: [pelicula_instax_mini]

  - id: paris
    nombre: Paris
    url: https://www.paris.cl
    plataforma: auto
    # Bloquea a los programas automáticos (responde 403).
    activa: false
    categorias: [pelicula_instax_mini]

  - id: ripley
    nombre: Ripley
    url: https://simple.ripley.cl
    plataforma: auto
    # Bloquea a los programas automáticos (desafío de Cloudflare, 403).
    activa: false
    categorias: [pelicula_instax_mini]

  - id: falabella
    nombre: Falabella
    url: https://www.falabella.com/falabella-cl
    plataforma: falabella
    categorias: [cargador_portatil, pelicula_instax_mini]

  # ---------- Construcción / pinturas ----------
  - id: sodimac
    nombre: Sodimac
    url: https://www.sodimac.cl/sodimac-cl
    plataforma: falabella
    categorias: [cargador_portatil, pintura_antihongos]

  - id: easy
    nombre: Easy
    url: https://www.easy.cl
    plataforma: auto
    # Bloquea a los programas automáticos (responde 403).
    activa: false
    categorias: [pintura_antihongos]

  # ---------- Supermercados ----------
  - id: jumbo
    nombre: Jumbo
    url: https://www.jumbo.cl
    plataforma: auto
    categorias: [compotas, jugos_sin_azucar, cereales_infantiles, barritas, galletas_colacion,
                 cafe_grano, alimento_mascotas, crema_cuerpo_ninos]

  - id: santaisabel
    nombre: Santa Isabel
    url: https://www.santaisabel.cl
    plataforma: cencosud
    categorias: [compotas, jugos_sin_azucar, cereales_infantiles, barritas, galletas_colacion,
                 cafe_grano, alimento_mascotas, crema_cuerpo_ninos]

  - id: unimarc
    nombre: Unimarc
    url: https://www.unimarc.cl
    plataforma: auto
    # Bloquea a los programas automáticos (responde 403).
    activa: false
    categorias: [compotas, jugos_sin_azucar, cereales_infantiles, barritas, galletas_colacion,
                 cafe_grano, alimento_mascotas, crema_cuerpo_ninos]

  - id: lider
    nombre: Líder
    url: https://www.lider.cl
    plataforma: auto
    # Líder tiene protección anti-bots fuerte; se deja pausada hasta probarla.
    activa: false
    categorias: [compotas, jugos_sin_azucar, cereales_infantiles, barritas, galletas_colacion,
                 cafe_grano, alimento_mascotas, crema_cuerpo_ninos]
