# Tiendas a revisar.
#
# plataforma:
#   sfcc / falabella / cencosud / magento / ikea -> lectores especiales (SuperZoo, Falabella y Sodimac,
#                                            Santa Isabel, Casa Ideas)
#   auto     -> detecta sola si la tienda es Shopify, VTEX o usa datos schema.org (recomendado)
#   shopify  -> tiendas Shopify (usa /products.json y /search/suggest.json)
#   vtex     -> tiendas VTEX (API pública de catálogo)
#   jsonld   -> cualquier web con datos de producto schema.org en la página de búsqueda
#
# catalogo_completo: true  -> descarga todo el catálogo (útil en marcas pequeñas)
#                    false -> sólo busca los términos de cada categoría de interés
# categorias: limita qué categorías de interés se buscan en esa tienda (vacío = todas)
# alerta_precio_maximo: avisa todo producto de esa tienda que cueste esto o menos (p. ej. 10000)
# activa: false para pausar una tienda sin borrarla

tiendas:
  # ---------- Marcas infantiles ----------
  - id: pichintun
    nombre: Pichintun
    url: https://www.pichintun.com
    plataforma: auto
    catalogo_completo: true
    categorias: [traje_bano_nina_t2, traje_bano_nino_t6, ropa_nina_t2, ropa_nino_t6, calzado_ergonomico,
                 juguetes_ninos]

  - id: colloky
    nombre: Colloky
    url: https://www.colloky.cl
    plataforma: auto
    catalogo_completo: false
    categorias: [traje_bano_nina_t2, traje_bano_nino_t6, ropa_nina_t2, ropa_nino_t6, calzado_ergonomico,
                 juguetes_ninos]

  - id: umababy
    nombre: Uma Baby
    url: https://www.umababy.cl
    plataforma: auto
    catalogo_completo: true
    categorias: [calzado_ergonomico]

  - id: casaideas
    nombre: Casa Ideas
    url: https://www.casaideas.cl
    plataforma: magento
    api: https://headless.casaideas.cl/graphql
    ruta_producto: /producto/{url_key}
    categorias: [maleta_cabina, organizadores_equipaje, banano_documentos, nee_doh, cocina_juguete, hot_wheels_mario_kart, cuboro, juegos_escalada, manualidades_mostacillas, sillas_infantiles, marcos_fotos, limpiapies, cargador_portatil, peluches, rompecabezas, libros_actividades, dinosaurios, juguetes_ninos, organizacion_hogar,
                 cafeteras, robot_cocina, pelicula_instax_mini]

  - id: ikea
    nombre: IKEA
    url: https://www.ikea.com/cl/es
    plataforma: ikea
    # Además de las ofertas de 30%+, avisa todo lo que cueste $10.000 o menos (peluches destacados)
    alerta_precio_maximo: 10000
    categorias: [maleta_cabina, organizadores_equipaje, banano_documentos, cocina_juguete, sillas_infantiles, marcos_fotos, limpiapies, cargador_portatil, peluches, rompecabezas, dinosaurios, juguetes_ninos, organizacion_hogar]

  # ---------- Mascotas ----------
  - id: superzoo
    nombre: SuperZoo
    url: https://www.superzoo.cl
    plataforma: sfcc
    categorias: [alimento_mascotas, juguetes_mascotas]

  - id: fernapet
    nombre: Fernapet
    url: https://www.fernapet.cl
    plataforma: vtex
    categorias: [marcos_fotos, alimento_mascotas, juguetes_mascotas, peluches, limpiapies, organizacion_hogar]

  - id: casaroyal
    nombre: Casa Royal
    url: https://www.casaroyal.cl
