# Compromisos de Desempeño 2024 (formulario QuestionPro/UCampus), ANONIMIZADOS. Aún sin informe de cierre.
# Los sujetos 02 y 09 son las mismas personas del ejercicio 2023. El formulario 2024 no pide jerarquía, perfil
# ni jornada, y su resumen tiene sólo docencia, investigación y VcM: las horas de gestión se toman de los
# textos libres u observaciones cuando la persona las indica.
compromisos_2024:
  - sujeto: "02"
    jerarquia: titular
    completo: false
    declarado: "Sin resumen de horas (el formulario termina en docencia)."
    horas: {}
    actividades:
      docencia: "Asignaturas 1 y 2 (pregrado) y dirección de 2 tesis"
    tareas:
