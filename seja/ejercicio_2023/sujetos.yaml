# Ejercicio de calificación SEJA con los registros 2023, ANONIMIZADO.
#
# Fuentes: Reportes de Compromiso de Desempeño (octubre 2023), Informes de Cierre (marzo 2024) y
# formularios de Compromiso de Desempeño 2023. No se registran nombres de personas, jefaturas,
# departamentos, asignaturas ni proyectos.
#
# Sujetos 01–06: compromiso + informe de cierre (hay cumplimiento por actividad, pero no horas).
# Sujetos 07–09: formulario de compromiso con horas (no hay informe de cierre).
#
# Evidencia: se transcribe la etapa comprometida y la evidenciada del informe de cierre. Una actividad
# "sin evidencia" queda sin etapa evidenciada (0%). Se considera validada la evidencia que tiene un
# mecanismo de respaldo (carta, constancia, certificado, informe, registro).

con_cierre:
  - sujeto: "01"
    jerarquia: asociado
    jerarquia_reporte: asociado
    perfil_supuesto: vinculador
    jornada: completa
    ingreso: 2020
    mayoria_reporte: [gestion]
    funciones_reporte: [docencia, investigacion, gestion]
    tareas:
      - {ambito: docencia, subcategoria: cursos_pregrado, descripcion: "Asignaturas 1 y 2 (pregrado)",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Registro UCampus}}
      - {ambito: docencia, subcategoria: direccion_titulacion, descripcion: "Asignatura 3 (investigación de pregrado)",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Registro UCampus}}
      - {ambito: docencia, subcategoria: direccion_titulacion, descripcion: "Asignaturas 4 y 5 (investigación de postgrado)",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Registro UCampus}}
      - {ambito: investigacion, subcategoria: proyectos, descripcion: "Proyecto con financiamiento externo (ANID)",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: ejecucion, mecanismo: Carta de aprobación}}
      - {ambito: investigacion, subcategoria: proyectos, descripcion: "Proyecto de creación con financiamiento externo",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: ejecucion, mecanismo: Carta de aprobación}}
      - {ambito: investigacion, subcategoria: proyectos, descripcion: "Proyecto con financiamiento interno",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: ejecucion, mecanismo: Carta compromiso}}
      - {ambito: investigacion, subcategoria: publicaciones, descripcion: "3 artículos (2 enviados y 1 publicado)",
         evidencia: {etapa_comprometida: enviada, etapa_evidenciada: publicada, mecanismo: Certificados y cartas, validado: true}}
      - {ambito: vinculacion, subcategoria: iniciativas_vcm, descripcion: "1 coloquio",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Afiches y programas}}
      - {ambito: vinculacion, subcategoria: iniciativas_vcm, descripcion: "2 seminarios",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Afiches y programas}}
      - {ambito: vinculacion, subcategoria: actividades_relevantes, descripcion: "2 exposiciones",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Afiches y programas}}
      - {ambito: vinculacion, subcategoria: difusion, descripcion: "1 actividad de difusión",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Afiches y programas}}
      - {ambito: vinculacion, subcategoria: extension, descripcion: "1 asesoría externa",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Notificación por correo}}
      - {ambito: gestion, subcategoria: direccion, descripcion: "Coordinación de biblioteca de la unidad",
         evidencia: {etapa_comprometida: ejecucion, etapa_evidenciada: finalizada, mecanismo: Carga académica}}
      - {ambito: gestion, subcategoria: comisiones, descripcion: "Comité ejecutivo de magíster",
         evidencia: {etapa_comprometida: ejecucion, mecanismo: Informe del magíster}}
      - {ambito: gestion, subcategoria: comisiones, descripcion: "Consejo académico del departamento",
         evidencia: {etapa_comprometida: ejecucion, mecanismo: Informe de la carrera}}
    informe_2023: "Todas las funciones de la Res. 320/93 cumplidas (5 de 5). Gestión: 2 de 3 actividades sin evidencia."
    hallazgos:
      - "El resumen del reporte declara funciones de docencia, investigación y gestión, pero la tabla del mismo reporte incluye 6 iniciativas de VcM y 1 asesoría externa."
      - "El reporte indica que la gestión es mayoritaria en horas, aunque el compromiso declara 3 actividades de gestión frente a 5 de docencia y 7 de VcM: sin horas no es verificable."

